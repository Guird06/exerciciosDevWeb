<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 07</title>
    <script src="./scripts/index.js" defer></script>
    <link rel="stylesheet" href="./styles/global.css" type="text/css">
</head>

<body>
    <header>
        <h1>Formulário super complexo</h1>
    </header>

    <main>
        <h2>Cadastro</h2>
        <form id="cadastro" novalidate onsubmit="executar(event)">

            <label for="nome">Nome*</label>
            <input type="text" id="nome">
            <p id="erro-nome" class="oculto"></p>

            <label for="nome">Idade*</label>
            <input type="number" id="idade">
            <p id="erro-idade" class="oculto"></p>

            <label for="email">Email*</label>
            <input type="email" id="email">
            <p id="erro-email" class="oculto"></p>

            <label>
                <input type="checkbox" name="termos" id="termos">
                Li e aceito os termos
                <p id="erro-termos" class="oculto"></p>
            </label>

            <button type="submit">
                Enviar
            </button>
            <p id="concluido" class="oculto"></p>
        </form>
    </main>

    <footer>
        <p>Projeto Javascript</p>
    </footer>
</body>

</html>
