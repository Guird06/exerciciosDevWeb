<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula09</title>
    <link rel="stylesheet" href="./styles/global.css">
    <script src="./scripts/index.js" defer></script>
</head>

<body>
    <header>
        <h1>Meus Jogos</h1>
    </header>
    <main>
        <section class="container-cards">

            <div class="card" id="freefire">
                <h2>Free Fire</h2>
                <p>Battle Royale</p>
                <button onclick="marcar('freefire','Free fire')">Click</button>
            </div>

            <div class="card" id="lol">
                <h2>League Of Legends</h2>
                <p>MOBA</p>
                <button onclick="marcar('lol','League of Legends')">Click</button>
            </div>

            <div class="card" id="valorant">
                <h2>Valorant</h2>
                <p>FPS Tatico</p>
                <button onclick="marcar('valorant','Valorant')">Click</button>
            </div>

            <div class="card" id="minecraft">
                <h2>Minecraft</h2>
                <p>Survival</p>
                <button onclick="marcar('minecraft','Minecraft')">Click</button>
            </div>

            <div class="card" id="fortnite">
                <h2>Fortnite</h2>
                <p>Battle Royale</p>
                <button onclick="marcar('fortnite','Fortnite')">Click</button>
            </div>


            <div class="card" id="fifa">
                <h2>Fifa</h2>
                <p>Futebol Royale</p>
                <button onclick="marcar('fifa','Fifa')">Click</button>
            </div>

        </section>
    </main>
    <footer>
        <p>Projeto para conhecermos media queries e web storage</p>
    </footer>
</body>

</html>
